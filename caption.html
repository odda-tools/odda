<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>مولد كابشن عربي | عُدّة</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <meta
    name="description"
    content="اكتب كابشن جذاب لمنشوراتك على السوشيال ميديا مجانًا."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />

  <style>
    .tool-page {
      width: min(850px, calc(100% - 30px ));
      margin: 45px auto 80px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 25px;
      color: var(--primary);
      font-size: 14px;
      font-weight: 700;
    }

    .tool-box {
      padding: 35px;
      border: 1px solid var(--border);
      border-radius: 25px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .tool-title {
      margin-bottom: 8px;
      font-size: 32px;
    }

    .tool-description {
      margin-bottom: 28px;
      color: var(--muted);
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    .form-input,
    .form-select,
    .form-textarea {
      width: 100%;
      padding: 0 15px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      color: var(--text);
      background: var(--bg);
      font-family: inherit;
      font-size: 14px;
    }

    .form-input,
    .form-select {
      height: 52px;
    }

    .form-textarea {
      min-height: 110px;
      padding-top: 14px;
      resize: vertical;
    }

    .form-input:focus,
    .form-select:focus,
    .form-textarea:focus {
      border-color: var(--primary);
    }

    .generate-button,
    .copy-button {
      width: 100%;
      height: 54px;
      border: none;
      border-radius: 12px;
      color: white;
      background: var(--primary);
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .generate-button:hover {
      background: var(--primary-dark);
    }

    .caption-result {
      display: none;
      margin-top: 28px;
      padding: 25px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background:
        linear-gradient(135deg, rgba(108, 77, 246, 0.1), transparent),
        var(--bg);
    }

    .result-label {
      color: var(--primary);
      font-size: 12px;
      font-weight: 800;
    }

    .caption-text {
      min-height: 120px;
      margin: 12px 0 18px;
      color: var(--text);
      font-size: 15px;
      line-height: 2;
      white-space: pre-line;
    }

    .copy-button {
      background: #252638;
    }

    .copy-button:hover {
      background: #161725;
    }

    .copy-message {
      display: none;
      margin-top: 10px;
      color: #32a56a;
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 600px) {
      .tool-box {
        padding: 24px 18px;
      }

      .tool-title {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>
  <header class="navbar">
    <a href="index.html" class="logo">
      <span class="logo-icon">ع</span>
      <span>عُدّة</span>
    </a>

    <nav class="nav-links">
      <a href="index.html#tools">الأدوات</a>
      <a href="index.html#categories">التصنيفات</a>
      <a href="index.html#about">عن عُدّة</a>
    </nav>

    <button class="theme-button" id="themeButton">◐</button>
  </header>

  <main class="tool-page">
    <a href="index.html" class="back-link">→ العودة إلى الأدوات</a>

    <section class="tool-box">
      <h1 class="tool-title">مولد كابشن عربي</h1>

      <p class="tool-description">
        اكتب تفاصيل بسيطة عن منشورك واحصل على كابشن جاهز للنشر.
      </p>

      <div class="form-group">
        <label class="form-label" for="topicInput">
          موضوع المنشور
        </label>

        <textarea
          class="form-textarea"
          id="topicInput"
          placeholder="مثال: صورة لمنتج جديد أو رحلة مع الأصدقاء"
        ></textarea>
      </div>

      <div class="form-group">
        <label class="form-label" for="toneSelect">
          أسلوب الكابشن
        </label>

        <select class="form-select" id="toneSelect">
          <option value="friendly">ودي وعفوي</option>
          <option value="professional">احترافي</option>
          <option value="funny">مضحك</option>
          <option value="motivational">تحفيزي</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="platformSelect">
          المنصة
        </label>

        <select class="form-select" id="platformSelect">
          <option value="instagram">Instagram</option>
          <option value="facebook">Facebook</option>
          <option value="tiktok">TikTok</option>
        </select>
      </div>

      <button class="generate-button" id="generateButton">
        إنشاء الكابشن
      </button>

      <div class="caption-result" id="captionResult">
        <span class="result-label">الكابشن المقترح</span>

        <div class="caption-text" id="captionText"></div>

        <button class="copy-button" id="copyButton">
          نسخ الكابشن
        </button>

        <div class="copy-message" id="copyMessage">
          تم نسخ الكابشن بنجاح
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="footer-logo">
      <span class="logo-icon">ع</span>
      <strong>عُدّة</strong>
    </div>

    <p>أدوات ذكية وبسيطة تساعدك تنجز شغلك.</p>
  </footer>

  <script>
    const topicInput = document.getElementById("topicInput");
    const toneSelect = document.getElementById("toneSelect");
    const platformSelect = document.getElementById("platformSelect");
    const generateButton = document.getElementById("generateButton");
    const captionResult = document.getElementById("captionResult");
    const captionText = document.getElementById("captionText");
    const copyButton = document.getElementById("copyButton");
    const copyMessage = document.getElementById("copyMessage");
    const themeButton = document.getElementById("themeButton");

    let currentCaption = "";

    generateButton.addEventListener("click", function () {
      const topic = topicInput.value.trim();

      if (!topic) {
        alert("اكتب موضوع المنشور أولًا.");
        topicInput.focus();
        return;
      }

      const tone = toneSelect.value;
      const platform = platformSelect.value;

      let caption = "";

      if (tone === "friendly") {
        caption =
          `كل لحظة في ${topic} ليها حكاية جميلة ✨\n\n` +
          `إيه رأيكم؟ شاركوني رأيكم في التعليقات 💬\n\n` +
          `#يوميات #محتوى #تجربة`;
      }

      if (tone === "professional") {
        caption =
          `نشارككم اليوم ${topic}.\n\n` +
          `هدفنا دائمًا تقديم قيمة حقيقية وتجربة أفضل.\n\n` +
          `للمزيد من التفاصيل، تابعونا وتواصلوا معنا.`;
      }

      if (tone === "funny") {
        caption =
          `${topic}، والنتيجة طلعت أحسن مما توقعت 😂\n\n` +
          `مين جرب حاجة شبه كده قبل كده؟\n\n` +
          `#ضحك #ترفيه #يوميات`;
      }

      if (tone === "motivational") {
        caption =
          `كل خطوة صغيرة بتقربك من هدفك 💪\n\n` +
          `${topic} مجرد بداية، والمهم إنك تكمل وما تستسلمش.\n\n` +
          `ابدأ النهارده، والنتيجة هتفرحك بكرة.`;
      }

      if (platform === "tiktok") {
        caption += "\n\n#fyp #اكسبلور #تيك_توك";
      } else if (platform === "instagram") {
        caption += "\n\n#instagram #اكسبلور #محتوى_عربي";
      } else {
        caption += "\n\n#فيسبوك #منشورات #محتوى_عربي";
      }

      currentCaption = caption;
      captionText.textContent = caption;
      captionResult.style.display = "block";
      copyMessage.style.display = "none";
    });

    copyButton.addEventListener("click", async function () {
      try {
        await navigator.clipboard.writeText(currentCaption);
        copyMessage.style.display = "block";

        setTimeout(function () {
          copyMessage.style.display = "none";
        }, 2500);
      } catch (error) {
        alert("انسخ الكابشن يدويًا من الشاشة.");
      }
    });

    themeButton.addEventListener("click", function () {
      document.body.classList.toggle("dark");

      themeButton.textContent =
        document.body.classList.contains("dark") ? "☀" : "◐";
    });
  </script>
</body>
</html>
